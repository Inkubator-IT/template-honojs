version: "3.9"

services:
  app:
    build: .
    container_name: hono-template
    env_file:
      - .env
    ports:
      - "${APP_PORT}:5050"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: db-template
    env_file:
      - .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
